<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460">
<rect width="920" height="460" fill="#0e141b"/>
<text x="460" y="32" fill="#e8eef4" font-size="18" text-anchor="middle" font-family="sans-serif">Veritas OTH node setup</text>
<rect x="40" y="70" width="250" height="150" rx="8" fill="#1b2836" stroke="#7eb6ff"/>
<text x="165" y="98" fill="#e8eef4" font-size="14" text-anchor="middle" font-family="sans-serif">Raspberry Pi 5</text>
<text x="165" y="120" fill="#9fb0c3" font-size="12" text-anchor="middle" font-family="sans-serif">app, crypto, mesh</text>
<text x="165" y="140" fill="#9fb0c3" font-size="12" text-anchor="middle" font-family="sans-serif">UDP 48750 timing</text>
<text x="165" y="160" fill="#9fb0c3" font-size="12" text-anchor="middle" font-family="sans-serif">Tor SOCKS for IP hops</text>
<rect x="40" y="250" width="250" height="120" rx="8" fill="#1b2836" stroke="#f0c674"/>
<text x="165" y="278" fill="#e8eef4" font-size="14" text-anchor="middle" font-family="sans-serif">FPGA / SDR</text>
<text x="165" y="300" fill="#9fb0c3" font-size="12" text-anchor="middle" font-family="sans-serif">NCO, phase, MIMO</text>
<text x="165" y="320" fill="#9fb0c3" font-size="12" text-anchor="middle" font-family="sans-serif">hop + 31-chip spread</text>
<text x="165" y="348" fill="#f0c674" font-size="12" text-anchor="middle" font-family="sans-serif">GPIO or USB</text>
<rect x="360" y="250" width="200" height="120" rx="8" fill="#1b2836" stroke="#b5e48c"/>
<text x="460" y="286" fill="#e8eef4" font-size="14" text-anchor="middle" font-family="sans-serif">Coil or vertical</text>
